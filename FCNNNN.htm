<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FCN DEADLOCK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --acid: #39ff14;
    --bg: #020302;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

body {
    background: radial-gradient(circle at top, #081408, var(--bg));
    color: var(--acid);
    overflow-x: hidden;
}

/* ===== SECTIONS ===== */
section {
    min-height: 100vh;
    padding: 80px 10%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* ===== GLITCH LOGO ===== */
.glitch {
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 0.3em;
    position: relative;
    text-shadow: 0 0 25px var(--acid);
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    width: 100%;
}

.glitch::before {
    color: #00ffee;
    top: -2px;
    clip-path: inset(0 0 60% 0);
    animation: glitchTop 2s infinite alternate-reverse;
}

.glitch::after {
    color: #00ff00;
    top: 2px;
    clip-path: inset(40% 0 0 0);
    animation: glitchBottom 1.5s infinite alternate-reverse;
}

@keyframes glitchTop {
    from { transform: translateX(-2px); }
    to { transform: translateX(2px); }
}
@keyframes glitchBottom {
    from { transform: translateX(2px); }
    to { transform: translateX(-2px); }
}

/* ===== SCROLL INDICATOR ===== */
.scroll-indicator {
    position: absolute;
    bottom: 40px;
    letter-spacing: 0.3em;
    font-size: 0.8rem;
    animation: blink 1.2s infinite;
}

.scroll-indicator::after {
    content: "↓";
    display: block;
    margin-top: 10px;
    font-size: 1.2rem;
}

@keyframes blink {
    0%,100% { opacity: 0.15; }
    50% { opacity: 1; }
}

/* ===== REVEAL + GLITCH ===== */
.reveal {
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.reveal.active {
    opacity: 1;
    transform: translateY(0);
    animation: glitchAppear 0.4s steps(2);
}

@keyframes glitchAppear {
    0% { transform: translateX(-5px); }
    25% { transform: translateX(5px); }
    50% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
}

/* ===== MANIFEST ===== */
.manifest {
    max-width: 600px;
    line-height: 1.7;
    text-align: center;
}

/* ===== TRACKS ===== */
.tracks {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.track {
    text-decoration: none;
    color: var(--acid);
    border: 2px solid var(--acid);
    padding: 18px 30px;
    letter-spacing: 0.2em;
    box-shadow: 0 0 15px rgba(57,255,20,0.25);
    transition: 0.2s;
    position: relative;
}

/* ===== FLICKER ON HOVER ===== */
.track:hover {
    animation: flicker 0.15s steps(2) 3;
    background: var(--acid);
    color: #000;
    box-shadow: 0 0 40px var(--acid);
    transform: scale(1.04);
}

@keyframes flicker {
    0% { opacity: 1; }
    20% { opacity: 0.2; }
    40% { opacity: 1; }
    60% { opacity: 0.3; }
    100% { opacity: 1; }
}

.track span {
    opacity: 0.6;
    margin-right: 15px;
}

/* NOISE */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(57,255,20,0.04) 3px
    );
    pointer-events: none;
}
</style>
</head>
<body>

<!-- HERO -->
<section>
    <div class="glitch" data-text="FCN DEADLOCK">FCN DEADLOCK</div>
    <div class="scroll-indicator">SCROLL</div>
</section>

<!-- MANIFEST -->
<section>
    <div class="manifest reveal">
        Это не фон.  
        Это перегрузка сигнала.  
        Город шумит, мысли режут,  
        а звук остаётся единственным выходом.
        <br><br>
        FCN DEADLOCK — когда связь потеряна,
        но ты всё ещё слышишь.
    </div>
</section>

<!-- TRACKS -->
<section>
    <div class="tracks reveal">
        <a class="track" href="https://music.yandex.ru/album/39756095/track/146241456?ref_id=32E75F1A-B2B0-4BBC-AFB2-B55C1D676EB1&utm_medium=copy_link" target="_blank">
            <span>01</span> НАХЕР ТЕБЯ
        </a>

        <a class="track" href="https://music.yandex.ru/album/36974675/track/139977620?ref_id=D81D7E8C-9E7A-47C8-AE45-84EF672B5B38&utm_medium=copy_link" target="_blank">
            <span>02</span> GO OUT
        </a>

        <a class="track" href="https://music.yandex.ru/album/38035448/track/142455618?ref_id=3C52C15C-7CA8-4371-A65B-BB66FD6F8253&utm_medium=copy_link" target="_blank">
            <span>03</span> smith n wesson
        </a>
    </div>
</section>

<script>
const reveals = document.querySelectorAll('.reveal');

function revealOnScroll() {
    const trigger = window.innerHeight * 0.85;

    reveals.forEach(el => {
        const top = el.getBoundingClientRect().top;
        if (top < trigger) {
            el.classList.add('active');
        }
    });
}

window.addEventListener('scroll', revealOnScroll);
revealOnScroll();
</script>

</body>
</html>
